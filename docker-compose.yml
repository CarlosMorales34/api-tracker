services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vitalis
      MYSQL_USER: vitalis
      MYSQL_PASSWORD: vitalis
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/infrastructure/database/mysql/migrations:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
